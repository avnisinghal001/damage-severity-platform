[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damage-analytics"
version = "0.1.0"
description = "Auditable dataset preparation and analysis for RC1841"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<13", "numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
training = ["torch>=2.6,<3"]

[project.scripts]
damage-analytics = "damage_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

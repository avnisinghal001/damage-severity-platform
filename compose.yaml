name: damage-platform-task12
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run serving.configure first}
      POSTGRES_USER: ${POSTGRES_USER:?Run serving.configure first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run serving.configure first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/python.Dockerfile
    environment:
      DAMAGE_API_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: [python, -m, damage_analytics.serving.migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  severity:
    build:
      context: .
      dockerfile: deploy/python.Dockerfile
    command: [python, -m, uvicorn, "damage_analytics.serving.severity_app:create_app", --factory, --host, "0.0.0.0", --port, "8001", --workers, "1"]
    environment:
      SEVERITY_CHECKPOINT: /models/severity.pt
      SEVERITY_CHECKPOINT_SHA256: ${SEVERITY_CHECKPOINT_SHA256:?Missing severity pin}
      SEVERITY_DEVICE: cpu
    volumes:
      - type: bind
        source: ${SEVERITY_CHECKPOINT_HOST:?Missing severity checkpoint}
        target: /models/severity.pt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/python.Dockerfile
    environment:
      DAMAGE_API_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DAMAGE_API_CHECKPOINT: /models/segmentation.pt
      DAMAGE_API_CHECKPOINT_SHA256: ${SEGMENTATION_CHECKPOINT_SHA256:?Missing segmentation pin}
      DAMAGE_API_CRACK_CHECKPOINT: /models/crack.pt
      DAMAGE_API_CRACK_CHECKPOINT_SHA256: ${CRACK_CHECKPOINT_SHA256:?Missing crack pin}
      DAMAGE_API_SEVERITY_URL: http://severity:8001
      DAMAGE_API_SEVERITY_CHECKPOINT_SHA256: ${SEVERITY_CHECKPOINT_SHA256:?Missing severity pin}
      DAMAGE_API_STORAGE_DIR: /var/lib/damage/inspections
      DAMAGE_API_DEVICE: cpu
      DAMAGE_API_CPU_THREADS: "1"
    volumes:
      - artifacts:/var/lib/damage/inspections
      - type: bind
        source: ${SEGMENTATION_CHECKPOINT_HOST:?Missing segmentation checkpoint}
        target: /models/segmentation.pt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CRACK_CHECKPOINT_HOST:?Missing crack checkpoint}
        target: /models/crack.pt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      severity:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  database:
  artifacts:
